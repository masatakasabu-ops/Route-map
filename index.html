<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ルート図</title>
<meta name="theme-color" content="#f4f6f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 地図の画像に GPX を重ね、速度帯ごとに色分けする。練習メモと同じ配色 */
:root {
  --bg: #f4f6f1;
  --surface: #ffffff;
  --fg: #1d241c;
  --muted: #5d6a5b;
  --line: #d9dfd3;
  --accent: #e8731a;
  --accent-fg: #ffffff;
  --forest: #3f7d3a;
  --overprint: #a626a4;   /* コース図の紫 */
  --warn: #c0392b;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141913; --surface: #1d241c; --fg: #e8ede4; --muted: #9aa697; --line: #2f392d;
    --accent: #f08a35; --accent-fg: #1a1208; --forest: #7cbf74; --overprint: #d77bd5; --warn: #ef6b5b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141913; --surface: #1d241c; --fg: #e8ede4; --muted: #9aa697; --line: #2f392d;
  --accent: #f08a35; --accent-fg: #1a1208; --forest: #7cbf74; --overprint: #d77bd5; --warn: #ef6b5b; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(32px + env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
main { max-width: 760px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.35rem; margin: 0; letter-spacing: .02em; }
header a { color: var(--muted); font-size: .9rem; }
h2 { font-size: .8rem; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
section { min-width: 0; }
.hint { font-size: .8rem; color: var(--muted); margin-top: 6px; min-height: 1.2em; }
.hint.err { color: var(--warn); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.ghost { font: inherit; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.ghost:disabled { opacity: .45; cursor: default; }
.ghost.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.primary {
  width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-fg);
  font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer;
}
.primary:disabled { opacity: .45; cursor: default; }
input[type="text"] {
  font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0;
}
input[type="range"] { width: 100%; accent-color: var(--accent); }

.loadrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.filebtn {
  position: relative; display: grid; place-items: center; min-height: 52px; padding: 8px; text-align: center;
  border: 1px dashed var(--muted); border-radius: 12px; background: var(--surface); cursor: pointer; font-weight: 700;
}
.filebtn small { display: block; font-weight: 400; font-size: .75rem; color: var(--muted); }
.filebtn.done { border-style: solid; border-color: var(--forest); }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.icu { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-top: 8px; }
.icu button {
  flex: none; display: grid; gap: 0; text-align: left; padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: .85rem; cursor: pointer;
}
.icu button b { font-weight: 700; }
.icu button span { font-family: var(--font-num); font-size: .75rem; color: var(--muted); }
.icu button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.stage {
  position: relative; height: min(72vh, 680px); border-radius: 12px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line);
}
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage .empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); pointer-events: none; }
.bubble {
  position: absolute; left: 10px; right: 10px; top: 10px; padding: 8px 12px; border-radius: 10px;
  background: var(--overprint); color: #fff; font-weight: 700; font-size: .9rem; pointer-events: none;
}
.toolbar { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.toolbar .ghost { padding: 8px 12px; font-size: .9rem; box-shadow: 0 1px 4px rgb(0 0 0 / .18); }
.toolbar .ghost.on { background: var(--overprint); border-color: var(--overprint); color: #fff; }
.probe { font-family: var(--font-num); font-size: .85rem; margin-top: 6px; min-height: 1.3em; }

.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--line); }
.seg button { min-height: 38px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); }
.field { display: grid; gap: 4px; margin-top: 12px; }
.field > span { font-size: .85rem; font-weight: 700; }
.field input[type="text"] { width: 100%; font-family: var(--font-num); }
.even { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: .85rem; }
.even input { width: 4.6em; font-family: var(--font-num); text-align: center; padding: 7px 4px; }
.even .ghost { padding: 7px 12px; }

.legend { display: grid; gap: 6px; margin-top: 14px; }
.lg { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; }
.lg input[type="color"] { grid-row: 1 / span 2; width: 34px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
.lg .name { font-family: var(--font-num); font-size: .9rem; font-weight: 700; }
.lg .num { font-family: var(--font-num); font-size: .75rem; color: var(--muted); text-align: right; white-space: nowrap; }
.lg .bar { grid-column: 2 / span 2; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.lg .bar i { display: block; height: 100%; }

.sliders { display: grid; gap: 12px; }
.sl { display: grid; gap: 2px; }
.sl > div { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; }
.sl b { font-family: var(--font-num); font-weight: 700; }
.check { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { display: grid; gap: 0; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.tile .k { font-size: .72rem; color: var(--muted); letter-spacing: .06em; }
.tile .v { font-family: var(--font-num); font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.export { display: grid; gap: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ルート図</h1>
    <a href="https://masatakasabu-ops.github.io/Training-memo/">← 練習メモ</a>
  </header>

  <section>
    <h2>1. 読み込む</h2>
    <div class="loadrow">
      <label class="filebtn" id="imgLabel">地図の画像<small>写真・スキャン</small><input type="file" id="imgFile" accept="image/*"></label>
      <label class="filebtn" id="gpxLabel">GPXファイル<small>.gpx</small><input type="file" id="gpxFile" accept=".gpx,application/gpx+xml,application/xml,text/xml"></label>
    </div>
    <div id="icuBox" hidden>
      <div class="hint">または Intervals.icu の記録（直近14日）から選ぶ</div>
      <div id="icuList" class="icu"></div>
    </div>
    <div class="hint" id="loadMsg"></div>
  </section>

  <section>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="empty" id="empty">地図の画像と GPX を読み込むと、ここに重ねて表示します</div>
      <div class="bubble" id="bubble" hidden></div>
      <div class="toolbar">
        <button class="ghost" type="button" id="pairBtn" disabled>合わせ点を追加</button>
        <button class="ghost" type="button" id="undoBtn" disabled>1つ戻す</button>
        <button class="ghost" type="button" id="fitBtn">全体</button>
      </div>
    </div>
    <div class="probe" id="probe"></div>
    <div class="hint" id="alignMsg">軌跡をタップすると、その地点の速度が出ます。2本指で拡大、ドラッグで移動。</div>
  </section>

  <section>
    <h2>2. 速度の色分け</h2>
    <div class="seg" role="group" aria-label="単位">
      <button type="button" data-unit="pace">ペース（分/km）</button>
      <button type="button" data-unit="kmh">速度（km/h）</button>
    </div>
    <label class="field"><span>区切り</span><input type="text" id="bounds" autocomplete="off" spellcheck="false"></label>
    <div class="hint" id="boundsMsg"></div>
    <div class="even">
      <span>等間隔で</span>
      <input type="text" id="evFrom" aria-label="から">〜<input type="text" id="evTo" aria-label="まで">
      <span>刻み</span><input type="text" id="evStep" aria-label="刻み">
      <button class="ghost" type="button" id="evBtn">作る</button>
    </div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2>3. 区間と表示</h2>
    <div class="sliders">
      <div class="sl"><div><span>はじめ</span><b id="aLbl"></b></div><input type="range" id="rangeA" min="0" max="1" value="0"></div>
      <div class="sl"><div><span>おわり</span><b id="bLbl"></b></div><input type="range" id="rangeB" min="0" max="1" value="1"></div>
      <div class="summary" id="summary"></div>
      <div class="sl"><div><span>速度のならし</span><b id="smLbl"></b></div><input type="range" id="smooth" min="1" max="30" value="8"></div>
      <div class="sl"><div><span>線の太さ</span><b id="lwLbl"></b></div><input type="range" id="lw" min="2" max="14" value="5"></div>
      <div class="sl"><div><span>地図の濃さ</span><b id="opLbl"></b></div><input type="range" id="op" min="20" max="100" value="100"></div>
      <label class="check"><input type="checkbox" id="halo" checked>線を白で縁取る（地図の色と見分けやすく）</label>
    </div>
  </section>

  <section class="export">
    <h2>4. 画像にする</h2>
    <button class="primary" type="button" id="expBtn" disabled>画像を作る</button>
    <div class="hint" id="expMsg">いま画面で見ている線の太さのまま、地図全体を1枚の画像にします。</div>
  </section>
</main>

<script>
const API = "https://intervals.icu/api/v1";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function pad(n) { return String(n).padStart(2, "0"); }

// 遅い → 速い。地図の黄・緑・茶とぶつかりにくいよう彩度の高い色にしている
const RAMP = ["#c1121f", "#f3722c", "#f9c74f", "#90be6d", "#2a9d8f", "#277da1", "#5a189a"];
const MAX_BOUNDS = 12;

const cv = $("cv"), ctx = cv.getContext("2d");
let img = null, W = 2000, H = 2000;
let track = null;          // { name, n, px, py, t, d, v, band, ix, iy, hasTime }
let A = { re: 1, im: 0 }, B = { re: 0, im: 0 };  // 画像座標 = A × 軌跡座標 + B（複素数で回転・縮尺・移動）
let pairs = [];            // 合わせ点 { i: 軌跡の点, q: 画像上の位置 }
let view = { k: 1, x: 0, y: 0 };
let mode = "idle", pendingI = -1, probeI = -1;
let unit = "pace", th = [6, 7.5, 3600 / 390, 3600 / 330, 3600 / 270], colorOverride = {};
let ra = 0, rb = 1;
let exportFile = null;

/* ---------- 単位 ---------- */

function toHalf(s) { return s.replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/：/g, ":"); }
function fmtPace(kmh) {
  if (!(kmh > 0)) return "--:--";
  const s = Math.round(3600 / kmh);
  return `${Math.floor(s / 60)}:${pad(s % 60)}`;
}
function fmtKmh(kmh) { return (Math.round(kmh * 10) / 10).toString(); }
function fmtVal(kmh) { return unit === "pace" ? fmtPace(kmh) : fmtKmh(kmh); }
// ペースは「4:30」「4」「4.5」（分）、速度は km/h の数字。km/h にして返す
function parseVal(tok) {
  tok = toHalf(tok.trim());
  if (unit === "pace") {
    const m = tok.match(/^(\d+)(?::(\d{1,2}))?$/) || tok.match(/^(\d+\.\d+)$/);
    if (!m) return NaN;
    const sec = m[2] != null ? Number(m[1]) * 60 + Number(m[2]) : Number(m[1]) * 60;
    return sec > 0 ? 3600 / sec : NaN;
  }
  const v = Number(tok);
  return v > 0 ? v : NaN;
}
function paceSec(tok) { const kmh = parseVal(tok); return 3600 / kmh; }
function fmtDur(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}:${pad(m)}:${pad(s % 60)}` : `${m}:${pad(s % 60)}`;
}

/* ---------- GPX ---------- */

function child(el, name) {
  for (const c of el.children) if (c.localName === name) return c.textContent;
  return null;
}

function parseGpx(text, name) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("GPXファイルを読めませんでした。");
  const nodes = doc.getElementsByTagNameNS("*", "trkpt");
  const lat = [], lon = [], tt = [];
  for (const p of nodes) {
    const la = Number(p.getAttribute("lat")), lo = Number(p.getAttribute("lon"));
    if (!Number.isFinite(la) || !Number.isFinite(lo)) continue;
    lat.push(la); lon.push(lo);
    const ts = child(p, "time");
    tt.push(ts ? Date.parse(ts) / 1000 : NaN);
  }
  const n = lat.length;
  if (n < 2) throw new Error("このGPXには軌跡がありません。");

  // 平面に投影（m）。x は東、y は南を正にして、そのまま北が上の画像座標に乗るようにする
  const lat0 = lat.reduce((s, v) => s + v, 0) / n, lon0 = lon.reduce((s, v) => s + v, 0) / n;
  const my = 6371008.8 * Math.PI / 180, mx = my * Math.cos(lat0 * Math.PI / 180);
  const px = new Float64Array(n), py = new Float64Array(n), d = new Float64Array(n), t = new Float64Array(n);
  const hasTime = tt.every(Number.isFinite) && tt[n - 1] > tt[0];
  for (let i = 0; i < n; i++) {
    px[i] = (lon[i] - lon0) * mx;
    py[i] = -(lat[i] - lat0) * my;
    if (i) d[i] = d[i - 1] + Math.hypot(px[i] - px[i - 1], py[i] - py[i - 1]);
    t[i] = hasTime ? tt[i] - tt[0] : NaN;
  }
  return { name, n, px, py, t, d, hasTime, v: new Float64Array(n), band: new Uint8Array(n), ix: new Float64Array(n), iy: new Float64Array(n) };
}

function setTrack(tr) {
  track = tr;
  pairs = []; mode = "idle"; pendingI = -1; probeI = -1; exportFile = null;
  ra = 0; rb = tr.n - 1;
  for (const id of ["rangeA", "rangeB"]) { $(id).max = tr.n - 1; }
  $("rangeA").value = ra; $("rangeB").value = rb;
  $("gpxLabel").classList.add("done");
  computeSpeed(); fitTrack(); fitView(); refresh();
}

// 前後 win 秒の移動距離から速度を出す。GPS のぶれで色がちらつくのを抑える
function computeSpeed() {
  if (!track || !track.hasTime) return;
  const { n, t, d, v } = track, half = Number($("smooth").value) / 2;
  let j0 = 0, j1 = 0;
  for (let i = 0; i < n; i++) {
    while (t[j0] < t[i] - half) j0++;
    if (j1 < i) j1 = i;
    while (j1 + 1 < n && t[j1 + 1] <= t[i] + half) j1++;
    const dt = t[j1] - t[j0];
    v[i] = dt > 0 ? (d[j1] - d[j0]) / dt : (i ? v[i - 1] : 0);
  }
  computeBands();
}

function bandOf(kmh) { let b = 0; while (b < th.length && kmh >= th[b]) b++; return b; }
function computeBands() {
  if (!track || !track.hasTime) return;
  const { n, v, band } = track;
  for (let i = 0; i < n - 1; i++) band[i] = bandOf((v[i] + v[i + 1]) / 2 * 3.6);
}

/* ---------- 位置合わせ ---------- */

function project() {
  if (!track) return;
  const { n, px, py, ix, iy } = track;
  for (let i = 0; i < n; i++) {
    ix[i] = A.re * px[i] - A.im * py[i] + B.re;
    iy[i] = A.im * px[i] + A.re * py[i] + B.im;
  }
}

// 合わせ点がないときは北を上にして画像の8割に収める
function fitTrack() {
  const { px, py } = track;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < track.n; i++) {
    x0 = Math.min(x0, px[i]); x1 = Math.max(x1, px[i]); y0 = Math.min(y0, py[i]); y1 = Math.max(y1, py[i]);
  }
  const s = 0.8 * Math.min(W / Math.max(x1 - x0, 1), H / Math.max(y1 - y0, 1));
  A = { re: s, im: 0 };
  B = { re: W / 2 - s * (x0 + x1) / 2, im: H / 2 - s * (y0 + y1) / 2 };
  project();
}

// 1点なら移動だけ、2点以上なら回転・縮尺も最小二乗で合わせる（形は崩さない）
function solvePairs() {
  if (!pairs.length) { fitTrack(); return; }
  const P = pairs.map(p => [track.px[p.i], track.py[p.i]]), Q = pairs.map(p => [p.q.x, p.q.y]);
  if (pairs.length >= 2) {
    const m = pairs.length;
    const pm = [P.reduce((s, p) => s + p[0], 0) / m, P.reduce((s, p) => s + p[1], 0) / m];
    const qm = [Q.reduce((s, q) => s + q[0], 0) / m, Q.reduce((s, q) => s + q[1], 0) / m];
    let re = 0, im = 0, den = 0;
    for (let k = 0; k < m; k++) {
      const ax = P[k][0] - pm[0], ay = P[k][1] - pm[1], bx = Q[k][0] - qm[0], by = Q[k][1] - qm[1];
      re += bx * ax + by * ay; im += by * ax - bx * ay; den += ax * ax + ay * ay;
    }
    if (den > 0) A = { re: re / den, im: im / den };
    B = { re: qm[0] - (A.re * pm[0] - A.im * pm[1]), im: qm[1] - (A.im * pm[0] + A.re * pm[1]) };
  } else {
    B = { re: Q[0][0] - (A.re * P[0][0] - A.im * P[0][1]), im: Q[0][1] - (A.im * P[0][0] + A.re * P[0][1]) };
  }
  project();
}

function alignText() {
  if (!track) return "軌跡をタップすると、その地点の速度が出ます。2本指で拡大、ドラッグで移動。";
  if (!img) return "地図の画像を読み込むと、軌跡を地図に合わせられます。";
  if (!pairs.length) return "いまは北を上にして置いただけです。「合わせ点を追加」で、コントロールや道の分岐など場所のはっきりした点を2〜3か所、なるべく離して合わせてください。";
  if (pairs.length === 1) return "合わせ点1か所：位置だけ合わせています。もう1か所以上で向きと縮尺も合います。";
  const scale = Math.hypot(A.re, A.im);
  const rms = Math.sqrt(pairs.reduce((s, p) => s + (track.ix[p.i] - p.q.x) ** 2 + (track.iy[p.i] - p.q.y) ** 2, 0) / pairs.length);
  const rot = Math.round(Math.atan2(A.im, A.re) * 180 / Math.PI);
  return `合わせ点${pairs.length}か所：ずれ 平均${Math.round(rms / scale)}m ・ 回転${rot}° ・ 地図1pxあたり${(1 / scale).toFixed(2)}m。ずれが大きい点は「1つ戻す」で外せます。`;
}

/* ---------- 描画 ---------- */

let rafId = 0;
function draw() { if (!rafId) rafId = requestAnimationFrame(() => { rafId = 0; render(); }); }

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function rgbToHex(c) { return "#" + c.map(v => Math.round(v).toString(16).padStart(2, "0")).join(""); }
function rampColor(f) {
  const p = f * (RAMP.length - 1), i = Math.min(RAMP.length - 2, Math.floor(p)), u = p - i;
  const a = hexToRgb(RAMP[i]), b = hexToRgb(RAMP[i + 1]);
  return rgbToHex(a.map((v, k) => v + (b[k] - v) * u));
}
function bandColors() {
  const n = th.length + 1;
  return Array.from({ length: n }, (_, b) => colorOverride[b] || rampColor(n === 1 ? .5 : b / (n - 1)));
}

// 画像座標で描く。lw は画像座標での線の太さ
function drawScene(c, lw, opts = {}) {
  if (img) {
    c.globalAlpha = Number($("op").value) / 100;
    c.drawImage(img, 0, 0);
    c.globalAlpha = 1;
  } else {
    c.fillStyle = "#ffffff"; c.fillRect(0, 0, W, H);
  }
  if (!track) return;
  const { ix, iy, band } = track;
  c.lineCap = "round"; c.lineJoin = "round";
  if ($("halo").checked) {
    c.strokeStyle = "rgba(255,255,255,.9)"; c.lineWidth = lw * 1.8;
    c.beginPath(); c.moveTo(ix[ra], iy[ra]);
    for (let i = ra + 1; i <= rb; i++) c.lineTo(ix[i], iy[i]);
    c.stroke();
  }
  c.lineWidth = lw;
  if (!track.hasTime) {
    c.strokeStyle = "#c1121f";
    c.beginPath(); c.moveTo(ix[ra], iy[ra]);
    for (let i = ra + 1; i <= rb; i++) c.lineTo(ix[i], iy[i]);
    c.stroke();
  } else {
    const cols = bandColors(), paths = cols.map(() => new Path2D());
    for (let i = ra; i < rb; i++) { const p = paths[band[i]]; p.moveTo(ix[i], iy[i]); p.lineTo(ix[i + 1], iy[i + 1]); }
    paths.forEach((p, b) => { c.strokeStyle = cols[b]; c.stroke(p); });
  }
  // スタートの三角とゴールの二重丸（コース図の記号）
  const op = opts.overprint || "#a626a4", r = lw * 2.4;
  c.strokeStyle = op; c.lineWidth = lw * .55;
  const ang = Math.atan2(iy[Math.min(rb, ra + 5)] - iy[ra], ix[Math.min(rb, ra + 5)] - ix[ra]);
  c.beginPath();
  for (let k = 0; k < 3; k++) {
    const a = ang + k * 2 * Math.PI / 3;
    c[k ? "lineTo" : "moveTo"](ix[ra] + r * 1.2 * Math.cos(a), iy[ra] + r * 1.2 * Math.sin(a));
  }
  c.closePath(); c.stroke();
  for (const rr of [r, r * .7]) { c.beginPath(); c.arc(ix[rb], iy[rb], rr, 0, Math.PI * 2); c.stroke(); }
}

function render() {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = cssVar("--surface"); ctx.fillRect(0, 0, cv.width, cv.height);
  $("empty").hidden = !!(img || track);
  if (!img && !track) return;
  ctx.setTransform(dpr * view.k, 0, 0, dpr * view.k, dpr * view.x, dpr * view.y);
  const lw = Number($("lw").value) / view.k;
  drawScene(ctx, lw, { overprint: cssVar("--overprint") });
  if (!track) return;
  const { ix, iy } = track, u = 1 / view.k;
  // 合わせ点：地図上の正しい位置（紫の円）と、軌跡のその点を結ぶ
  ctx.lineWidth = 2 * u;
  for (const p of pairs) {
    ctx.strokeStyle = "#a626a4";
    ctx.beginPath(); ctx.moveTo(p.q.x, p.q.y); ctx.lineTo(ix[p.i], iy[p.i]); ctx.stroke();
    ctx.beginPath(); ctx.arc(p.q.x, p.q.y, 10 * u, 0, Math.PI * 2); ctx.stroke();
  }
  for (const [i, col] of [[pendingI, "#a626a4"], [probeI, "#111111"]]) {
    if (i < 0) continue;
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = col; ctx.lineWidth = 3 * u;
    ctx.beginPath(); ctx.arc(ix[i], iy[i], 8 * u, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  draw();
}

function fitScale() { const r = cv.getBoundingClientRect(); return Math.min(r.width / W, r.height / H); }
function fitView() {
  const r = cv.getBoundingClientRect(), k = fitScale();
  view = { k, x: (r.width - W * k) / 2, y: (r.height - H * k) / 2 };
  draw();
}
function zoomAt(sx, sy, k) {
  const f = fitScale();
  k = Math.min(f * 40, Math.max(f * .5, k));
  const x = (sx - view.x) / view.k, y = (sy - view.y) / view.k;
  view = { k, x: sx - x * k, y: sy - y * k };
  draw();
}

/* ---------- 操作 ---------- */

const ptrs = new Map();
let gesture = null;

function local(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function startGesture() {
  const ps = [...ptrs.values()];
  if (ps.length === 1) gesture = { type: "pan", s: ps[0], v: { ...view }, moved: gesture?.type === "pinch", t: Date.now() };
  else if (ps.length >= 2) {
    const [a, b] = ps;
    gesture = { type: "pinch", d: Math.hypot(a.x - b.x, a.y - b.y) || 1, m: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, v: { ...view } };
  }
}
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, local(e));
  startGesture();
});
cv.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId) || !gesture) return;
  ptrs.set(e.pointerId, local(e));
  const ps = [...ptrs.values()];
  if (gesture.type === "pan") {
    const dx = ps[0].x - gesture.s.x, dy = ps[0].y - gesture.s.y;
    if (Math.hypot(dx, dy) > 6) gesture.moved = true;
    if (gesture.moved) { view = { ...gesture.v, x: gesture.v.x + dx, y: gesture.v.y + dy }; draw(); }
  } else if (ps.length >= 2) {
    const [a, b] = ps, g = gesture;
    const f = fitScale(), k = Math.min(f * 40, Math.max(f * .5, g.v.k * Math.hypot(a.x - b.x, a.y - b.y) / g.d));
    const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const x = (g.m.x - g.v.x) / g.v.k, y = (g.m.y - g.v.y) / g.v.k;
    view = { k, x: m.x - x * k, y: m.y - y * k };
    draw();
  }
});
function endPointer(e) {
  if (!ptrs.has(e.pointerId)) return;
  const g = gesture, p = ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if (g && g.type === "pan" && !g.moved && !ptrs.size && Date.now() - g.t < 600) tap(p.x, p.y);
  if (ptrs.size) startGesture(); else gesture = null;
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const p = local(e);
  zoomAt(p.x, p.y, view.k * Math.exp(-e.deltaY * .0015));
}, { passive: false });

function nearestPoint(sx, sy) {
  const { ix, iy } = track;
  let best = -1, bd = Infinity;
  for (let i = ra; i <= rb; i++) {
    const dd = (ix[i] * view.k + view.x - sx) ** 2 + (iy[i] * view.k + view.y - sy) ** 2;
    if (dd < bd) { bd = dd; best = i; }
  }
  return { i: best, dist: Math.sqrt(bd) };
}

function tap(sx, sy) {
  if (!track) return;
  if (mode === "pickMap") {
    pairs.push({ i: pendingI, q: { x: (sx - view.x) / view.k, y: (sy - view.y) / view.k } });
    pendingI = -1; mode = "idle";
    solvePairs(); refresh();
    return;
  }
  const { i, dist } = nearestPoint(sx, sy);
  if (mode === "pickTrack") {
    if (dist > 44) { bubble("軌跡の線の上をタップしてください"); return; }
    pendingI = i; mode = "pickMap";
    bubble("次に、その点が地図上で本当はどこかをタップ");
    draw();
    return;
  }
  probeI = dist <= 44 ? i : -1;
  showProbe(); draw();
}

function showProbe() {
  const el = $("probe");
  if (probeI < 0 || !track) { el.textContent = ""; return; }
  const { t, d, v } = track, i = probeI;
  const parts = [];
  if (track.hasTime) parts.push(`${fmtDur(t[i] - t[ra])} 経過`);
  parts.push(`${((d[i] - d[ra]) / 1000).toFixed(2)}km`);
  if (track.hasTime) parts.push(`${fmtPace(v[i] * 3.6)}/km`, `${fmtKmh(v[i] * 3.6)}km/h`);
  el.textContent = "● " + parts.join(" ・ ");
}

function bubble(text) {
  $("bubble").textContent = text; $("bubble").hidden = !text;
  $("pairBtn").textContent = mode === "idle" ? "合わせ点を追加" : "やめる";
  $("pairBtn").classList.toggle("on", mode !== "idle");
}

$("pairBtn").addEventListener("click", () => {
  if (mode !== "idle") { mode = "idle"; pendingI = -1; refresh(); return; }
  mode = "pickTrack"; probeI = -1; showProbe();
  bubble("軌跡の上の、場所がはっきりした点をタップ");
  draw();
});
$("undoBtn").addEventListener("click", () => { pairs.pop(); solvePairs(); refresh(); });
$("fitBtn").addEventListener("click", fitView);

/* ---------- 色分けの設定 ---------- */

function boundsText() {
  const list = th.map(fmtVal);
  return (unit === "pace" ? list.reverse() : list).join(", ");
}

function setBounds(list) {
  const uniq = [...new Set(list.map(v => Math.round(v * 1000) / 1000))].sort((a, b) => a - b);
  if (uniq.length !== th.length) colorOverride = {};
  th = uniq.slice(0, MAX_BOUNDS);
  computeBands(); exportFile = null;
  renderLegend(); draw(); syncExport();
}

$("bounds").addEventListener("input", () => {
  const toks = toHalf($("bounds").value).split(/[,、\s]+/).filter(Boolean);
  const vals = toks.map(parseVal);
  if (!toks.length) { $("boundsMsg").textContent = "区切りがないので1色で塗ります。"; $("boundsMsg").className = "hint"; setBounds([]); return; }
  const bad = toks.filter((_, k) => !Number.isFinite(vals[k]));
  if (bad.length) { $("boundsMsg").textContent = `読めない値があります：${bad.join(" ")}`; $("boundsMsg").className = "hint err"; return; }
  $("boundsMsg").className = "hint";
  $("boundsMsg").textContent = vals.length > MAX_BOUNDS ? `区切りは${MAX_BOUNDS}個までです。` : "";
  setBounds(vals);
});
$("bounds").addEventListener("change", () => { $("bounds").value = boundsText(); });

function setUnit(u) {
  unit = u;
  for (const b of document.querySelectorAll("[data-unit]")) b.setAttribute("aria-pressed", String(b.dataset.unit === u));
  $("bounds").value = boundsText();
  $("boundsMsg").textContent = u === "pace" ? "例：4:30, 5:30, 6:30, 8:00, 10:00（区切りの数＋1色で塗り分け）" : "例：6, 8, 10, 12, 14（区切りの数＋1色で塗り分け）";
  $("boundsMsg").className = "hint";
  [$("evFrom").value, $("evTo").value, $("evStep").value] = u === "pace" ? ["4:00", "9:00", "1:00"] : ["6", "14", "2"];
  renderLegend(); showProbe(); refreshRangeLabels();
  try { localStorage.setItem("routeUnit", u); } catch {}
}
for (const b of document.querySelectorAll("[data-unit]")) b.addEventListener("click", () => setUnit(b.dataset.unit));

$("evBtn").addEventListener("click", () => {
  const msg = $("boundsMsg");
  let list = [];
  if (unit === "pace") {
    const f = paceSec($("evFrom").value), t = paceSec($("evTo").value), s = paceSec($("evStep").value);
    if (![f, t, s].every(x => x > 0)) { msg.textContent = "等間隔の値を「4:00」の形で入れてください。"; msg.className = "hint err"; return; }
    for (let x = Math.min(f, t); x <= Math.max(f, t) + .01 && list.length < MAX_BOUNDS; x += s) list.push(3600 / x);
  } else {
    const f = Number(toHalf($("evFrom").value)), t = Number(toHalf($("evTo").value)), s = Number(toHalf($("evStep").value));
    if (![f, t, s].every(x => x > 0)) { msg.textContent = "等間隔の値を数字で入れてください。"; msg.className = "hint err"; return; }
    for (let x = Math.min(f, t); x <= Math.max(f, t) + .001 && list.length < MAX_BOUNDS; x += s) list.push(x);
  }
  msg.textContent = ""; msg.className = "hint";
  setBounds(list);
  $("bounds").value = boundsText();
});

function bandLabel(b) {
  const lo = th[b - 1], hi = th[b], u = unit === "pace" ? "/km" : "km/h";
  if (!th.length) return "すべて";
  if (unit === "pace") {
    if (b === th.length) return `${fmtPace(lo)}より速い`;
    if (b === 0) return `${fmtPace(hi)}より遅い`;
    return `${fmtPace(hi)}〜${fmtPace(lo)}${u}`;
  }
  if (b === th.length) return `${fmtKmh(lo)}km/h以上`;
  if (b === 0) return `${fmtKmh(hi)}km/h未満`;
  return `${fmtKmh(lo)}〜${fmtKmh(hi)}${u}`;
}

// 速度帯ごとの時間と距離。オートポーズなど1分以上あいた区間は時間に数えない
function bandStats() {
  const n = th.length + 1, time = new Array(n).fill(0), dist = new Array(n).fill(0);
  if (track && track.hasTime) {
    const { t, d, band } = track;
    for (let i = ra; i < rb; i++) {
      const dt = t[i + 1] - t[i];
      if (dt > 60) continue;
      time[band[i]] += dt; dist[band[i]] += d[i + 1] - d[i];
    }
  }
  return { time, dist };
}

function renderLegend() {
  const box = $("legend"), cols = bandColors(), { time, dist } = bandStats();
  const total = time.reduce((s, v) => s + v, 0) || 1;
  box.innerHTML = "";
  for (let b = th.length; b >= 0; b--) {
    const row = document.createElement("div");
    row.className = "lg";
    const pct = Math.round(time[b] / total * 100);
    row.innerHTML = `<input type="color" value="${cols[b]}" aria-label="${esc(bandLabel(b))}の色">
      <span class="name">${esc(bandLabel(b))}</span>
      <span class="num">${track && track.hasTime ? `${fmtDur(time[b])} ・ ${(dist[b] / 1000).toFixed(2)}km ・ ${pct}%` : ""}</span>
      <span class="bar"><i style="width:${pct}%;background:${cols[b]}"></i></span>`;
    row.querySelector("input").addEventListener("input", e => {
      colorOverride[b] = e.target.value; exportFile = null; syncExport();
      row.querySelector(".bar i").style.background = e.target.value;
      draw();
    });
    box.appendChild(row);
  }
  if (track && !track.hasTime) box.insertAdjacentHTML("beforeend", '<div class="hint err">このGPXには時刻がないので、速度で色分けできません。</div>');
}

/* ---------- 区間と表示 ---------- */

function refreshRangeLabels() {
  if (!track) { $("aLbl").textContent = $("bLbl").textContent = "--"; $("summary").innerHTML = ""; return; }
  const { t, d, hasTime } = track;
  const lbl = i => hasTime ? `${fmtDur(t[i])}（${(d[i] / 1000).toFixed(2)}km）` : `${(d[i] / 1000).toFixed(2)}km`;
  $("aLbl").textContent = lbl(ra); $("bLbl").textContent = lbl(rb);
  const km = (d[rb] - d[ra]) / 1000, sec = hasTime ? t[rb] - t[ra] : NaN;
  const tiles = [["距離", `${km.toFixed(2)}km`], ["時間", hasTime ? fmtDur(sec) : "--"], ["平均", hasTime && km > 0 ? `${fmtPace(km / sec * 3600)}/km` : "--"]];
  $("summary").innerHTML = tiles.map(([k, v]) => `<div class="tile"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");
}

function onRange(e) {
  let a = Number($("rangeA").value), b = Number($("rangeB").value);
  if (a >= b) { if (e.target.id === "rangeA") a = b - 1; else b = a + 1; $("rangeA").value = a; $("rangeB").value = b; }
  ra = a; rb = b;
  if (probeI >= 0 && (probeI < ra || probeI > rb)) probeI = -1;
  exportFile = null; syncExport();
  refreshRangeLabels(); renderLegend(); showProbe(); draw();
}
$("rangeA").addEventListener("input", onRange);
$("rangeB").addEventListener("input", onRange);

function refreshSliderLabels() {
  $("smLbl").textContent = `前後${$("smooth").value}秒`;
  $("lwLbl").textContent = `${$("lw").value}px`;
  $("opLbl").textContent = `${$("op").value}%`;
}
$("smooth").addEventListener("input", () => { refreshSliderLabels(); computeSpeed(); renderLegend(); showProbe(); exportFile = null; syncExport(); draw(); });
for (const id of ["lw", "op", "halo"]) $(id).addEventListener("input", () => { refreshSliderLabels(); exportFile = null; syncExport(); draw(); });

function refresh() {
  bubble(mode === "pickTrack" ? "軌跡の上の、場所がはっきりした点をタップ" : mode === "pickMap" ? "次に、その点が地図上で本当はどこかをタップ" : "");
  $("pairBtn").disabled = !(track && img);
  $("undoBtn").disabled = !pairs.length;
  $("alignMsg").textContent = alignText();
  exportFile = null; syncExport();
  refreshRangeLabels(); renderLegend(); showProbe(); draw();
}

/* ---------- 読み込み ---------- */

function loadMsg(text, err) { $("loadMsg").textContent = text; $("loadMsg").className = err ? "hint err" : "hint"; }

$("imgFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    img = im; W = im.naturalWidth; H = im.naturalHeight;
    $("imgLabel").classList.add("done");
    pairs = []; mode = "idle"; pendingI = -1;
    if (track) fitTrack();
    fitView(); refresh();
    loadMsg(`地図：${f.name}（${W}×${H}px）`);
  };
  im.onerror = () => loadMsg("画像を読めませんでした。JPEG か PNG で試してください。", true);
  im.src = url;
});

$("gpxFile").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    setTrack(parseGpx(await f.text(), f.name.replace(/\.gpx$/i, "")));
    loadMsg(`GPX：${f.name}（${track.n}点）`);
    for (const b of $("icuList").children) b.setAttribute("aria-pressed", "false");
  } catch (err) { loadMsg(err.message, true); }
});

// 練習メモと同じサイトなので、そちらで保存した接続設定をそのまま使える
function loadCfg() {
  try { return JSON.parse(localStorage.getItem("intervalsCfg")) || {}; } catch { return {}; }
}
const cfg = loadCfg();

async function icu(path) {
  const res = await fetch(API + path, { headers: { Authorization: "Basic " + btoa("API_KEY:" + cfg.key) } });
  if (res.status === 401 || res.status === 403) throw new Error("Intervals.icu に接続できません。練習メモの接続設定を確認してください。");
  if (!res.ok) throw new Error(`Intervals.icu がエラーを返しました（${res.status}）。`);
  return res;
}

async function loadActivity(id, label) {
  loadMsg("GPXを取得中…");
  try {
    const text = await (await icu(`/activity/${encodeURIComponent(id)}/gpx-file`)).text();
    if (!text.includes("<trkpt")) throw new Error("この記録には位置情報がありません。");
    setTrack(parseGpx(text, label));
    loadMsg(`GPX：${label}（${track.n}点）`);
    for (const b of $("icuList").children) b.setAttribute("aria-pressed", String(b.dataset.id === String(id)));
  } catch (err) { loadMsg(err.message, true); }
}

const WD = "日月火水木金土";
async function loadIcuList() {
  if (!cfg.aid || !cfg.key) return;
  $("icuBox").hidden = false;
  const box = $("icuList");
  box.innerHTML = '<span class="hint">読み込み中…</span>';
  try {
    const today = new Date(), from = new Date(today); from.setDate(from.getDate() - 13);
    const day = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const list = await (await icu(`/athlete/${encodeURIComponent(cfg.aid)}/activities?oldest=${day(from)}&newest=${day(today)}`)).json();
    const acts = list.filter(a => ["Run", "TrailRun", "Hike", "Walk"].includes(a.type) && (a.moving_time || 0) >= 120)
      .sort((x, y) => y.start_date_local.localeCompare(x.start_date_local));
    box.innerHTML = acts.length ? "" : '<span class="hint">位置情報のある記録がありません。</span>';
    for (const a of acts) {
      const d = new Date(a.start_date_local);
      const label = `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）${pad(d.getHours())}:${pad(d.getMinutes())}`;
      const b = document.createElement("button");
      b.type = "button"; b.dataset.id = a.id; b.setAttribute("aria-pressed", "false");
      b.innerHTML = `<b>${label}</b><span>${((a.distance || 0) / 1000).toFixed(1)}km ・ ${Math.round((a.moving_time || 0) / 60)}分</span>`;
      b.addEventListener("click", () => loadActivity(a.id, `${label} ${a.name || ""}`.trim()));
      box.appendChild(b);
    }
    // 練習メモの「ルート図で見る」から来たときは、その記録を開く
    const m = location.hash.match(/^#act-(.+)$/);
    if (m) {
      const id = decodeURIComponent(m[1]), b = [...box.children].find(x => x.dataset.id === id);
      if (b) b.click(); else loadActivity(id, id);
    }
  } catch (err) { box.innerHTML = ""; loadMsg(err.message, true); }
}

/* ---------- 画像にする ---------- */

function drawLegend(c, cw, ch) {
  const cols = bandColors(), { time } = bandStats(), total = time.reduce((s, v) => s + v, 0) || 1;
  const fs = Math.max(14, Math.round(Math.min(cw, ch) / 45)), pad_ = fs * .7, row = fs * 1.5;
  const rows = [];
  for (let b = th.length; b >= 0; b--) rows.push([cols[b], bandLabel(b), track.hasTime ? `${Math.round(time[b] / total * 100)}%` : ""]);
  const { t, d, hasTime } = track;
  const title = `${track.name}  ${((d[rb] - d[ra]) / 1000).toFixed(2)}km${hasTime ? "  " + fmtDur(t[rb] - t[ra]) : ""}`;
  c.font = `700 ${fs}px "Zen Kaku Gothic New", "Hiragino Sans", sans-serif`;
  const w = Math.max(c.measureText(title).width, ...rows.map(r => c.measureText(r[1] + "  " + r[2]).width + fs * 1.6)) + pad_ * 2;
  const h = row * (rows.length + 1) + pad_ * 2;
  const x = pad_, y = ch - h - pad_;
  c.fillStyle = "rgba(255,255,255,.92)"; c.fillRect(x, y, w, h);
  c.strokeStyle = "rgba(0,0,0,.25)"; c.lineWidth = 1; c.strokeRect(x + .5, y + .5, w - 1, h - 1);
  c.fillStyle = "#1d241c"; c.textBaseline = "middle";
  c.fillText(title, x + pad_, y + pad_ + row / 2);
  rows.forEach(([col, label, pct], k) => {
    const yy = y + pad_ + row * (k + 1.5);
    c.fillStyle = col; c.fillRect(x + pad_, yy - fs * .35, fs * 1.1, fs * .7);
    c.fillStyle = "#1d241c"; c.font = `500 ${fs}px "Zen Kaku Gothic New", "Hiragino Sans", sans-serif`;
    c.fillText(`${label}  ${pct}`, x + pad_ + fs * 1.6, yy);
  });
}

function syncExport() {
  const btn = $("expBtn");
  btn.disabled = !track;
  if (!exportFile) { btn.textContent = "画像を作る"; btn.classList.remove("ready"); }
}

async function makeImage() {
  const btn = $("expBtn"), scale = Math.min(1, 4096 / Math.max(W, H));
  btn.disabled = true; $("expMsg").textContent = "作成中…";
  try {
    const c = document.createElement("canvas");
    c.width = Math.round(W * scale); c.height = Math.round(H * scale);
    const x = c.getContext("2d");
    x.setTransform(scale, 0, 0, scale, 0, 0);
    drawScene(x, Number($("lw").value) / view.k);
    x.setTransform(1, 0, 0, 1, 0, 0);
    drawLegend(x, c.width, c.height);
    const type = img ? "image/jpeg" : "image/png";
    const blob = await new Promise(r => c.toBlob(r, type, .92));
    if (!blob) throw new Error("画像を作れませんでした。地図の画像が大きすぎるかもしれません。");
    const base = track.name.replace(/[\\/:*?"<>|\s（）]+/g, "_").replace(/^_+|_+$/g, "") || "route";
    exportFile = new File([blob], `${base}_速度.${img ? "jpg" : "png"}`, { type });
    const canShare = !!navigator.canShare?.({ files: [exportFile] });
    btn.textContent = canShare ? "保存・共有する" : "画像を保存";
    $("expMsg").textContent = `${exportFile.name}（${c.width}×${c.height}px、${Math.round(blob.size / 1024)}KB）`;
  } catch (err) {
    $("expMsg").textContent = err.message;
  } finally { btn.disabled = false; }
}

// iPhone はタップ直後でないと共有メニューを開けないので、「作る」と「保存」の2回に分ける
async function deliverImage() {
  const f = exportFile;
  if (navigator.canShare?.({ files: [f] })) {
    try { await navigator.share({ files: [f], title: f.name }); $("expMsg").textContent = "共有しました。"; }
    catch (e) { if (e.name !== "AbortError") $("expMsg").textContent = "共有できませんでした。もう一度押してください。"; }
    return;
  }
  const url = URL.createObjectURL(f), link = document.createElement("a");
  link.href = url; link.download = f.name;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  $("expMsg").textContent = `${f.name} を保存しました。`;
}
$("expBtn").addEventListener("click", () => (exportFile ? deliverImage() : makeImage()));

/* ---------- 起動 ---------- */

let savedUnit = "pace";
try { savedUnit = localStorage.getItem("routeUnit") || "pace"; } catch {}
setUnit(savedUnit);
refreshSliderLabels();
new ResizeObserver(resize).observe(cv);
refresh();
loadIcuList();
</script>
